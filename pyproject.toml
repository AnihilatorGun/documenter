[project]
name = "documenter"
version = "0.1.0"
description = "Family document tracker: files in Google Drive, searchable index in SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
