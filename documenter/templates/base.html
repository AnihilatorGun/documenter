<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Документы семьи{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <nav class="topbar-left">
    <a href="/">Документы</a>
    <a href="/documents/new">Добавить</a>
    {% if user and user.email == owner_email %}<a href="/invite">Приглашение</a>{% endif %}
  </nav>
  <div class="topbar-right">
    {% if user %}
    <span class="user-email">{{ user.email }}</span>
    <a href="/logout">Выйти</a>
    {% endif %}
  </div>
</header>
<main class="container">
{% if notice() %}<div class="notice">{{ notice() }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
